# Render.com Blueprint: ingyenes Docker web service a szervernek.
# Render dashboard: New > Blueprint > ez a repó. A szolgáltatás címe: https://mocsar-server.onrender.com
# (ha a név foglalt, Render utótagot ad; akkor a GitHub repó SERVER_URL változóját erre kell állítani).
#
# A zajló játékok a szerver memóriájában élnek: minden újratelepítés vagy újraindítás elveszíti őket.
# Ezért csak backend-változásra települ újra (buildFilter), a frontend pusholása nem indít deployt.
services:
  - type: web
    name: mocsar-server
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./mocsar-server/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - pom.xml
        - render.yaml
        - mocsar-core/**
        - mocsar-bot/**
        - mocsar-server/**
    envVars:
      - key: MOCSAR_ALLOWED_ORIGINS
        value: https://moroczhanna13.github.io
      # 512 MB-os ingyenes példány: a JVM teljes memóriája maradjon alatta.
      - key: JAVA_TOOL_OPTIONS
        value: -Xmx256m -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=48m -XX:+UseSerialGC -Xss512k
      # Tartós ranglistához ingyenes PostgreSQL (pl. Neon) adatai a dashboardon:
      # DB_URL=jdbc:postgresql://<host>/<db>?sslmode=require, DB_USER, DB_PASSWORD.
      # Nélkülük H2 memória-adatbázis fut, újraindításkor a statisztika törlődik.
