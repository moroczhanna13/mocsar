services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mocsar
      POSTGRES_USER: mocsar
      POSTGRES_PASSWORD: mocsar
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mocsar"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: .
      dockerfile: mocsar-server/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://db:5432/mocsar
      DB_USER: mocsar
      DB_PASSWORD: mocsar
      MOCSAR_ALLOWED_ORIGINS: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - server
    ports:
      - "3000:80"

volumes:
  dbdata:
