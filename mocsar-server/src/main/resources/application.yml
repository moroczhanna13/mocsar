spring:
  application:
    name: mocsar-server
  datasource:
    # DB_URL nélkül H2 memória-adatbázis (újraindításkor a ranglista törlődik).
    # PostgreSQL: DB_URL=jdbc:postgresql://host:5432/db?sslmode=require, DB_USER, DB_PASSWORD.
    url: ${DB_URL:jdbc:h2:mem:mocsar;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health

mocsar:
  bot-delay-ms: 700
  room-code-length: 5
  # Vesszővel elválasztva; a GitHub Pages címe is ide kell.
  allowed-origins: ${MOCSAR_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
